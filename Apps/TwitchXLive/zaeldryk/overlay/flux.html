<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Alerte follow, sub, don</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      background: transparent;
      width: 460px;
      height: 140px;
      color: #f0d48a;
      font-family: Cinzel, "Times New Roman", serif;
    }
    body.fond { background: #07140d; }
    .alert {
      box-sizing: border-box;
      width: 440px;
      min-height: 108px;
      margin: 10px;
      padding: 16px 18px;
      background:
        linear-gradient(180deg, rgba(240, 212, 138, 0.16), transparent 28%),
        linear-gradient(180deg, #1a4a32, #102418 58%, #0b1a12);
      border: 2px solid #f0d48a;
      border-radius: 10px;
      box-shadow:
        0 0 0 4px #143222,
        0 0 0 6px #a67c2d,
        inset 0 0 18px rgba(0, 0, 0, 0.45);
    }
    .alert.prime {
      border: 2px solid #d7c4ff;
      background:
        linear-gradient(180deg, rgba(215, 196, 255, 0.2), transparent 30%),
        linear-gradient(180deg, #3a2a68, #102418 62%, #0b1a12);
      box-shadow:
        0 0 0 4px #241848,
        0 0 0 6px #f0d48a,
        inset 0 0 16px rgba(215, 196, 255, 0.28);
    }
    .kicker {
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #d9c48a;
    }
    .alert.prime .kicker { color: #efe6ff; }
    .name {
      margin-top: 6px;
      font-size: 28px;
      line-height: 1.05;
      text-shadow: 0 2px 0 #6a4a16;
    }
  </style>
</head>
<body>
  <div id="slot"></div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("fond")) document.body.classList.add("fond");
    const slot = document.getElementById("slot");
    const seen = new Set();
    const queue = [];
    let showing = false;
    let primed = false;
    const SHOW_MS = 5000;

    function keyOf(kind, row) {
      return kind + "|" + (row.name || "") + "|" + (row.at || "") + "|" + (row.bits || "");
    }

    function label(kind, row) {
      if (kind === "followers") return "Nouveau follow";
      if (kind === "subs") return row.prime ? "Sub Prime" : row.gift ? "Sub cadeau" : "Nouveau sub";
      return "Don · " + (row.bits || 0) + " bits";
    }

    function eurosFromBits(bits) {
      return (Number(bits) || 0) / 100;
    }
    function rupeeFile(euros) {
      if (euros >= 200) return "sounds/rupee-gold.wav";
      if (euros >= 50) return "sounds/rupee-purple.wav";
      if (euros >= 20) return "sounds/rupee-red.wav";
      if (euros >= 5) return "sounds/rupee-blue.wav";
      return "sounds/rupee-green.wav";
    }
    function soundFor(kind, row) {
      if (kind === "followers") return "sounds/hey-listen.wav";
      if (kind === "subs") {
        const plan = String(row.plan || "");
        if (row.prime || plan === "1000" || plan === "2000") return "sounds/rupee-blue.wav";
        if (plan === "3000") return "sounds/rupee-red.wav";
        return "sounds/rupee-blue.wav";
      }
      return rupeeFile(eurosFromBits(row.bits));
    }
    function playSound(src) {
      const audio = new Audio(src);
      audio.volume = 1;
      audio.play().catch(() => {});
    }
    function render(kind, row) {
      const box = document.createElement("div");
      box.className = "alert" + (row.prime ? " prime" : "");
      const kicker = document.createElement("div");
      kicker.className = "kicker";
      kicker.textContent = label(kind, row);
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = row.name || "";
      box.append(kicker, name);
      slot.replaceChildren(box);
      playSound(soundFor(kind, row));
    }

    function pump() {
      if (showing) return;
      const next = queue.shift();
      if (!next) {
        slot.replaceChildren();
        return;
      }
      showing = true;
      render(next.kind, next.row);
      setTimeout(() => {
        showing = false;
        slot.replaceChildren();
        pump();
      }, SHOW_MS);
    }

    function enqueue(kind, rows) {
      for (const row of rows || []) {
        const key = keyOf(kind, row);
        if (seen.has(key)) continue;
        seen.add(key);
        if (!primed) continue;
        queue.push({ kind, row });
      }
    }

    async function tick() {
      try {
        const res = await fetch("/activity", { cache: "no-store" });
        const data = await res.json();
        enqueue("followers", data.followers);
        enqueue("subs", data.subs);
        enqueue("donations", data.donations);
        primed = true;
        pump();
      } catch (err) {
        /* silence */
      }
    }

    const demo = params.get("demo");
    if (demo) {
      const samples = {
        follow: ["followers", { name: "Epona", at: "1" }],
        sub: ["subs", { name: "Darunia", at: "2", prime: false }],
        prime: ["subs", { name: "Navi", at: "3", prime: true }],
        don: ["donations", { name: "Ruto", at: "4", bits: 100 }],
      };
      const item = samples[demo] || samples.prime;
      primed = true;
      queue.push({ kind: item[0], row: item[1] });
      pump();
    } else {
      tick();
      setInterval(tick, 3000);
    }
  </script>
</body>
</html>
