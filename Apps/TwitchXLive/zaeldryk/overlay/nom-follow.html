<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Dernier follow</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      container-type: size;
    }
    body.fond { background: #102418; }
    .nom {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8%;
      text-align: center;
      font-family: Cinzel, "Times New Roman", serif;
      font-size: 42cqh;
      line-height: 1.05;
      color: #f4e2a8;
      text-shadow: 0 2px 0 #3a250c;
    }
    .ligne {
      width: 100%;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="nom" id="nom">—</div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("fond")) document.body.classList.add("fond");
    const nom = document.getElementById("nom");
    let nameEl = null;
    function latest(rows) {
      const list = (rows || []).filter((row) => row && row.name);
      if (!list.length) return null;
      return list.slice().sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")))[0];
    }
    function fit(el) {
      if (!el || el.clientWidth < 8) return;
      const max = parseFloat(getComputedStyle(nom).fontSize) || 24;
      let size = max;
      el.style.fontSize = size + "px";
      while (size > 8 && el.scrollWidth > el.clientWidth + 1) {
        size -= 1;
        el.style.fontSize = size + "px";
      }
      el.dataset.fit = String(size);
    }
    function show(row) {
      nameEl = null;
      if (!row || !row.name) {
        nom.textContent = "—";
        return;
      }
      nom.textContent = "";
      const name = document.createElement("div");
      name.className = "ligne";
      name.textContent = row.name;
      nom.append(name);
      nameEl = name;
      requestAnimationFrame(() => fit(name));
    }
    if (params.has("demo")) {
      show({ name: params.get("nom") || "Epona", at: "1" });
    } else {
      async function tick() {
        try {
          const res = await fetch("/activity", { cache: "no-store" });
          const data = await res.json();
          show(latest(data.followers));
        } catch (err) { /* la plaque reste vide */ }
      }
      tick();
      setInterval(tick, 3000);
    }
    window.addEventListener("resize", () => fit(nameEl));
  </script>
</body>
</html>
