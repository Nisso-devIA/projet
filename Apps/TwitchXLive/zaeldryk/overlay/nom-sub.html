<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Dernier sub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      container-type: size;
    }
    body.fond { background: #102418; }
    .nom {
      box-sizing: border-box;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8%;
      text-align: center;
      font-family: Cinzel, "Times New Roman", serif;
      font-size: 46cqh;
      line-height: 1.05;
      color: #f4e2a8;
      text-shadow: 0 2px 0 #3a250c;
    }
  </style>
</head>
<body>
  <div class="nom" id="nom">—</div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("fond")) document.body.classList.add("fond");
    const nom = document.getElementById("nom");
    function show(row) {
      if (!row || !row.name) {
        nom.textContent = "—";
        return;
      }
      nom.textContent = row.prime ? row.name + " · Prime" : row.name;
    }
    if (params.has("demo")) {
      show({ name: "Navi", prime: true });
    } else {
      async function tick() {
        try {
          const res = await fetch("/activity", { cache: "no-store" });
          const data = await res.json();
          show((data.subs || [])[0]);
        } catch (err) { /* la plaque reste vide */ }
      }
      tick();
      setInterval(tick, 3000);
    }
  </script>
</body>
</html>
