<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Dernier sub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      container-type: size;
    }
    body.fond { background: #102418; }
    .nom {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 8%;
      text-align: center;
      font-family: Cinzel, "Times New Roman", serif;
      font-size: 46cqh;
      line-height: 1.05;
      color: #f4e2a8;
      text-shadow: 0 2px 0 #3a250c;
    }
    .ligne {
      width: 100%;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-align: center;
    }
    .sous {
      width: 100%;
      margin-top: 0.06em;
      font-size: 0.42em;
      line-height: 1;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="nom" id="nom">—</div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("fond")) document.body.classList.add("fond");
    const nom = document.getElementById("nom");
    let nameEl = null;
    function fit(el) {
      if (!el || el.clientWidth < 8) return;
      const max = parseFloat(getComputedStyle(nom).fontSize) || 28;
      let size = max;
      el.style.fontSize = size + "px";
      while (size > 8 && el.scrollWidth > el.clientWidth + 1) {
        size -= 1;
        el.style.fontSize = size + "px";
      }
      el.dataset.fit = String(size);
    }
    function kindOf(row) {
      if (row.prime) return "Prime";
      if (row.gift) return "Cadeau";
      if (row.tier) return String(row.tier);
      return "";
    }
    function show(row) {
      nameEl = null;
      if (!row || !row.name) {
        nom.textContent = "—";
        return;
      }
      nom.textContent = "";
      const name = document.createElement("div");
      name.className = "ligne";
      name.textContent = row.name;
      nom.append(name);
      nameEl = name;
      const kind = kindOf(row);
      if (kind) {
        const sub = document.createElement("div");
        sub.className = "sous";
        sub.textContent = kind;
        nom.append(sub);
      }
      requestAnimationFrame(() => fit(name));
    }
    if (params.has("demo")) {
      show({ name: params.get("nom") || "Navi", prime: true });
    } else {
      async function tick() {
        try {
          const res = await fetch("/activity", { cache: "no-store" });
          const data = await res.json();
          show((data.subs || [])[0]);
        } catch (err) { /* la plaque reste vide */ }
      }
      tick();
      setInterval(tick, 3000);
    }
    window.addEventListener("resize", () => fit(nameEl));
  </script>
</body>
</html>
